# load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    ##
    # 基础配置
    ##

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server_tokens off;

    ##
    # 日志
    ##

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    ##
    # GZIP 压缩
    ##

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    ##
    # Brotli 压缩（需要 nginx 安装 brotli 模块）
    #
    # Debian 默认 nginx 通常没有启用 brotli
    # 需要安装：
    #
    # apt install nginx-module-brotli
    #
    # 或自行编译模块
    ##

    brotli on;
    brotli_comp_level 6;
    brotli_static on;

    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    ##
    # upstream
    ##

    upstream springboot_backend {
        server ip:port; # 后端 API 服务地址
    }

    upstream websocket_backend {
        server ip:port; # 后端 WebSocket 服务地址
    }

    ##
    # HTTP
    ##

    server {

        listen 80;
        server_name fusionadmin.cn integration.net.cn syndra.cn;

        ##
        # React 打包目录
        ##

        root /home/syndra/web;
        index index.html;

        ##
        # React Router 支持
        ##

        location / {
            try_files $uri $uri/ /index.html;
        }

        ##
        # SpringBoot API 代理
        ##

        location /api/ {

            proxy_pass http://springboot_backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        ##
        # WebSocket 代理
        ##

        location /api/ws/ {

            proxy_pass http://websocket_backend/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400;
        }

        ##
        # 静态资源缓存
        ##

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {

            expires 30d;

            add_header Cache-Control "public, no-transform";
        }
    }

    ##
    # HTTPS 配置（暂时注释）
    ##

