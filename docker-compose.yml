services:
  syndra-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: syndra-admin:latest
    container_name: syndra-admin
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://host.docker.internal:9193}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped
